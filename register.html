<!DOCTYPE html>

<body>
  <header>
    <h1>Register for COSMAG</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>

  <main>
    <form action="https://docs.google.com/forms/d/e/your-google-form-link/formResponse" method="POST" target="_self">
      <label>Full Name:<input type="text" name="entry.1234567890" required></label>
      <label>College:<input type="text" name="entry.2345678901" required></label>
      <label>Email:<input type="email" name="entry.3456789012" required></label>
      <label>Phone Number:<input type="tel" name="entry.4567890123" required></label>
      <label>Event Category:
        <select name="entry.5678901234">
          <option value="Technical">Technical</option>
          <option value="Non-Technical">Non-Technical</option>
        </select>
      </label>
      <button type="submit">Submit</button>
    </form>
  </main>
